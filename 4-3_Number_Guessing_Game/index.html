<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body onload="initGame()">
    <h1>Number Guessing Game</h1>
    <p>Guess a number between 1-100</p>
    <label for="guessInput">Enter your guess:</label>
    <input id="guessInput" type="number" placeholder="0" />
    <button id="guessBtn" onclick="checkGuess()">Guess</button>
    <p id="guessesPara"></p>
    <p id="feedbackPara"></p>
    <p id="prevGuessesPara"></p>
    <button id="restartBtn" onclick="initGame()">Restart</button>
  </body>
</html>
